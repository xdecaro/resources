name: Normalize Resources 0.2.0 Identity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/normalize-xdecaro-0.2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: normalize-xdecaro-0.2.0
          fetch-depth: 0
      - run: python3 tools/normalize_identity.py
      - name: Validate
        run: |
          set -euo pipefail
          find component package -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path('.').rglob('*.xml'):
              if '.git' not in p.parts and '.github' not in p.parts: ET.parse(p)
          PY
          test "$(cat VERSION)" = '0.2.0'
          test -f component/xdecaroresources.xml
          test -f package/pkg_xdecaroresources.xml
          grep -Fq 'Xdecaro\Component\Resources' component/xdecaroresources.xml
          grep -Fq '#__xdecaroresources_' component/admin/sql/install.mysql.utf8mb4.sql
      - name: Commit branch
        run: |
          rm tools/normalize_identity.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize Resources 0.2.0 to xdecaro identity'
          git push origin HEAD:normalize-xdecaro-0.2.0
